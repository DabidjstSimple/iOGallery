name: Build Kuha Gallery APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-apk
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project.zip
        run: |
          if [ -f project.zip ]; then unzip -o project.zip; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npx cap add android
      - run: python3 scripts/prepare-android.py
      - run: npx cap sync android
      - name: Use the fixed signing key
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore
      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Check the APK has no network permission
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          AAPT=$(ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          if [ -z "$AAPT" ]; then
            echo "aapt2 not found, skipping the permission check"
          else
            "$AAPT" dump permissions "$APK" | tee permissions.txt
            if grep -q -E "INTERNET|ACCESS_NETWORK_STATE" permissions.txt; then
              echo "The APK still asks for a network permission. Stopping."
              exit 1
            fi
            echo "Confirmed: the APK has no network permission."
          fi
      - name: Publish the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk KuhaGallery.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest KuhaGallery.apk --title "Kuha Gallery (latest build)" --notes "Download KuhaGallery.apk and open it to install." --target "$GITHUB_SHA"
